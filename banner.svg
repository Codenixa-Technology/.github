<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Codenixa Technology">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="50%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#c04cff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <circle cx="1100" cy="60" r="170" fill="#7b5cff" opacity="0.18" filter="url(#glow)"/>
  <circle cx="150" cy="330" r="150" fill="#2f81f7" opacity="0.16" filter="url(#glow)"/>
  <circle cx="940" cy="340" r="100" fill="#c04cff" opacity="0.14" filter="url(#glow)"/>
  <rect width="1280" height="130" fill="url(#sheen)"/>

  <g transform="translate(90,96)">
    <rect x="0" y="0" width="96" height="96" rx="26" fill="#0b1020" stroke="url(#accent)" stroke-width="3"/>
    <text x="48" y="66" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="url(#accent)" text-anchor="middle">C</text>
  </g>

  <text x="216" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Codenixa Technology</text>
  <text x="216" y="192" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="500" fill="#9fb0d0">Software products for students and businesses</text>

  <rect x="90" y="240" width="1100" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600">
    <rect x="90" y="272" width="176" height="44" rx="22" fill="#2f81f7" fill-opacity="0.16" stroke="#2f81f7" stroke-opacity="0.55"/>
    <text x="178" y="300" fill="#8fc0ff" text-anchor="middle">Codenixa</text>

    <rect x="282" y="272" width="230" height="44" rx="22" fill="#7b5cff" fill-opacity="0.16" stroke="#7b5cff" stroke-opacity="0.55"/>
    <text x="397" y="300" fill="#c3b5ff" text-anchor="middle">Business Studio</text>

    <rect x="528" y="272" width="212" height="44" rx="22" fill="#c04cff" fill-opacity="0.14" stroke="#c04cff" stroke-opacity="0.5"/>
    <text x="634" y="300" fill="#e9b6ff" text-anchor="middle">Android · Web</text>

    <rect x="756" y="272" width="216" height="44" rx="22" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="864" y="300" fill="#9df0bd" text-anchor="middle">Firebase · Node</text>
  </g>
</svg>
